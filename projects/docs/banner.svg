<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e1e"/>
      <stop offset="1" stop-color="#1f5c3c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58f"/>
      <stop offset="1" stop-color="#b8863b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="najdi" width="24" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 L12 0 L24 14 Z" fill="#c9a45c" opacity=".55"/>
    </pattern>
  </defs>

  <style>
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .ar { animation-delay: .1s; }
    .en { animation-delay: .5s; }
    .sub { animation-delay: .9s; }
    .tags { animation-delay: 1.2s; }
    .line { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1s ease .4s forwards; }
    .year text { animation: float 4s ease-in-out infinite; }
    .year text:nth-child(2) { animation-delay: .3s; }
    .year text:nth-child(3) { animation-delay: .6s; }
    .year text:nth-child(4) { animation-delay: .9s; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .star:nth-of-type(2n) { animation-delay: -1s; }
    .star:nth-of-type(3n) { animation-delay: -2s; }
    .tower { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    .t2 { animation-delay: .15s; } .t3 { animation-delay: .3s; } .t4 { animation-delay: .45s; } .t5 { animation-delay: .6s; }
    .walker { animation: walk 9s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes twinkle { 50% { opacity: .2; } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes walk { from { transform: translateX(-40px); } to { transform: translateX(1320px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; } }
  </style>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <g fill="#ffffff">
    <circle class="star" cx="640" cy="40" r="1.5"/>
    <circle class="star" cx="720" cy="90" r="1"/>
    <circle class="star" cx="820" cy="30" r="1.5"/>
    <circle class="star" cx="1180" cy="60" r="1"/>
    <circle class="star" cx="560" cy="110" r="1"/>
    <circle class="star" cx="1240" cy="140" r="1.5"/>
    <circle class="star" cx="900" cy="120" r="1"/>
  </g>

  <g fill="#0a2418" opacity=".9">
    <path class="tower" d="M930 330 L938 200 L948 170 L958 200 L962 214 Q970 222 978 214 L982 200 L992 170 L1002 200 L1010 330 Z"/>
    <path class="tower t2" d="M1040 330 L1060 190 L1063 175 L1066 190 L1086 330 Z"/>
    <rect class="tower t3" x="1100" y="250" width="40" height="80"/>
    <rect class="tower t4" x="880" y="270" width="36" height="60"/>
    <rect class="tower t5" x="1150" y="230" width="28" height="100"/>
  </g>
  <circle cx="1063" cy="232" r="7" fill="url(#gold)" opacity=".85"/>

  <g class="year" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" fill="url(#gold)" opacity=".9">
    <text x="900" y="150">2</text>
    <text x="970" y="150">0</text>
    <text x="1040" y="150">3</text>
    <text x="1110" y="150">0</text>
  </g>

  <text class="rise ar" x="90" y="128" font-family="'Noto Kufi Arabic', 'Geeza Pro', 'Segoe UI', Tahoma, sans-serif" font-size="68" font-weight="700" fill="#f3d58f">رؤية</text>
  <line class="line" x1="90" y1="150" x2="310" y2="150" stroke="#c9a45c" stroke-width="3" stroke-linecap="round"/>
  <text class="rise en" x="90" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="10" fill="#ffffff">RUYA</text>
  <text class="rise sub" x="92" y="255" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#cfe3d6">SAUDI VISION 2030 · GIGA-PROJECTS</text>
  <text class="rise tags" x="92" y="292" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9fc4ad">Django  ·  HTML  ·  Pure CSS  ·  Zero JavaScript</text>

  <rect y="332" width="1280" height="28" fill="#0a2418"/>
  <rect y="332" width="1280" height="14" fill="url(#najdi)"/>
  <g class="walker">
    <circle cx="0" cy="326" r="4" fill="#f3d58f"/>
    <circle cx="0" cy="326" r="10" fill="#f3d58f" opacity=".2"/>
  </g>
</svg>
