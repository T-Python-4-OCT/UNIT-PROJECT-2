<nav class="navbar navbar-expand-xl site-navbar">
  <div class="container">
    <a class="navbar-brand" href="{% url 'portal:home' %}">
      {{ site.site_name }}
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="{{ ui.toggle_navigation }}">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        {% for nav_page in site.pages %}
          <li class="nav-item">
            <a class="nav-link{% if nav_page.slug == current_slug %} active{% endif %}"
               href="{% url 'portal:page' nav_page.slug %}"
               {% if nav_page.slug == current_slug %}aria-current="page"{% endif %}>
              {{ nav_page.title }}
            </a>
          </li>
        {% endfor %}
      </ul>

      <div class="d-flex flex-wrap align-items-center gap-2 ms-xl-3 mt-2 mt-xl-0">
        <form method="post" action="{% url 'portal:set_language' %}">
          {% csrf_token %}
          {% if language == "en" %}
            <input type="hidden" name="language" value="ar">
            <button class="btn btn-sm btn-outline-light" type="submit">
              العربية
            </button>
          {% else %}
            <input type="hidden" name="language" value="en">
            <button class="btn btn-sm btn-outline-light" type="submit">
              English
            </button>
          {% endif %}
        </form>

        <button
          class="btn btn-sm btn-outline-light"
          type="button"
          id="themeToggle"
          data-dark-label="{{ ui.dark_mode }}"
          data-light-label="{{ ui.light_mode }}"
          data-dark-aria="{{ ui.dark_aria }}"
          data-light-aria="{{ ui.light_aria }}"
          aria-label="{{ ui.dark_aria }}">
          {{ ui.dark_mode }}
        </button>
      </div>
    </div>
  </div>
</nav>
