{% load i18n static %}
<section class="project-gallery shell" aria-labelledby="gallery-title" data-project-gallery>
  <p class="eyebrow">{% translate "In pictures" %}</p>
  <h2 class="section-heading" id="gallery-title">{% translate "Photos and places" %}</h2>
  <div class="gallery-grid{% if project.gallery|length == 1 %} gallery-single{% endif %}">
    {% for photo in project.gallery %}
    <figure>
      {% include 'includes/project_photo.html' with photo=photo only %}
    </figure>
    {% endfor %}
  </div>
  <dialog class="photo-dialog" aria-label="{% translate 'Photo viewer' %}">
    <div class="photo-dialog-content">
      <form method="dialog">
        <button type="submit" autofocus>{% translate "Close photo" %}</button>
      </form>
      <figure></figure>
    </div>
  </dialog>
</section>
