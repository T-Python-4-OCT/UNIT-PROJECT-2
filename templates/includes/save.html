{% load i18n site_assets %}
<form class="save-form" method="post" action="{{ city.get_save_url|localize }}" data-city="{{ city.saved_key|localize }}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path|localize }}"><button class="save-button {% if city.saved_key in saved_slugs %}is-saved{% endif %}" type="submit" aria-pressed="{% if city.saved_key in saved_slugs %}true{% else %}false{% endif %}"><span class="save-symbol" aria-hidden="true">{% if city.saved_key in saved_slugs %}◆{% else %}◇{% endif %}</span><span class="save-label">{% if city.saved_key in saved_slugs %}{% translate "محفوظة" %}{% else %}{% translate "احفظ الحكاية" %}{% endif %}</span></button></form>
