{% load static %}
<!-- This partial keeps content cards consistent. -->
<!-- Reusable card with an image and short description. -->
<article class="card" data-kind="{{ kind }}">
  <div class="card__media">{% include "website/_media.html" with file=image alt=image_alt class="media--wide" %}</div>
  <div class="card__body">
    <span class="card__kind">{{ kind }}</span>
    <span class="card__place">{{ place }}</span>
    <h3>{{ title }}</h3>
    <p>{{ summary }}</p>
    {% if detail %}<p class="card__detail">{{ detail }}</p>{% endif %}
  </div>
</article>
