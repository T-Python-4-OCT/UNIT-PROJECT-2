{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}مسار الشمال{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/base.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <a class="nt-skip-link" href="#main-content">تخطّي إلى المحتوى</a>
  {% include "trail/partials/navbar.html" %}

  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  {% include "trail/partials/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/page-scrollspy.js' %}?v=4" defer></script>
</body>
</html>
